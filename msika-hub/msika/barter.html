<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Barter | Msika Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="barter">
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-mark">M</div>
      <div class="brand-copy">
        <span class="eyebrow">Community commerce</span>
        <h1>Msika Hub</h1>
      </div>
    </div>
    <nav aria-label="Main navigation">
      <a href="index.html" class="nav-link">Marketplace</a>
      <a href="mukando.html" class="nav-link">Mukando</a>
      <a href="barter.html" class="nav-link on">Barter</a>
      <a href="pos.html" class="nav-link">POS &amp; Stock</a>
      <a href="ads.html" class="nav-link">Adverts</a>
    </nav>
  </header>

  <main>
    <section class="panel-section">
      <div class="section-header compact">
        <div>
          <p class="eyebrow">Trade locally</p>
          <h2>Barter Trade</h2>
        </div>
      </div>
      <div class="split">
        <div>
          <div id="offers" class="grid"></div>
        </div>
        <aside class="side-panel">
          <form data-f="offer">
            <h3>Post an offer</h3>
            <input name="have" placeholder="I have..." required>
            <input name="want" placeholder="I want..." required>
            <input name="val" type="number" min="1" placeholder="Value (USD)" required>
            <button>Post offer</button>
          </form>
          <h3>Your swap proposals</h3>
          <div id="props"></div>
        </aside>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="data/mock-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
