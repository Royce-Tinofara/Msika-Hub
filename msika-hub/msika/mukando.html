<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mukando | Msika Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="mukando">
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-mark">M</div>
      <div class="brand-copy">
        <span class="eyebrow">Community commerce</span>
        <h1>Msika Hub</h1>
      </div>
    </div>
    <nav aria-label="Main navigation">
      <a href="index.html" class="nav-link">Marketplace</a>
      <a href="mukando.html" class="nav-link on">Mukando</a>
      <a href="barter.html" class="nav-link">Barter</a>
      <a href="pos.html" class="nav-link">POS &amp; Stock</a>
      <a href="ads.html" class="nav-link">Adverts</a>
    </nav>
  </header>

  <main>
    <section class="panel-section">
      <div class="section-header compact">
        <div>
          <p class="eyebrow">Community saving</p>
          <h2>Round / Mukando</h2>
        </div>
      </div>
      <div id="groups" class="grid"></div>
      <form data-f="group" class="card wide form-panel">
        <h3>Create a group</h3>
        <div class="inline">
          <input name="name" placeholder="Group name" required>
          <input name="amount" type="number" min="1" step="0.5" placeholder="Contribution (USD)" required>
        </div>
        <div class="inline">
          <select name="freq">
            <option>weekly</option>
            <option>monthly</option>
          </select>
          <input name="members" placeholder="Members, separated by commas" required>
          <button>Create group</button>
        </div>
      </form>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="data/mock-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
